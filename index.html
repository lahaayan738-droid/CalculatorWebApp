<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator Web App</title>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <div class="container">
            <button class="darkModeBtn">Dark</button>
            <div class="content">
                <div class="calculationArea">
                    <div class="display">
                        <span id="value"></span>
                        <span class="cursor">|</span>
                    </div>
                    <div class="answer"></div>
                    <div class="deleteIcon">
                        <i class="fa-solid fa-delete-left"></i>
                    </div>
                </div>
                <div class="numbers">
                    <div class="box c">
                        <div class="c">C</div>
                    </div>
                    <div class="box bracket">()
                    </div>
                    <div class="box percentage">%
                    </div>
                    <div class="box">
                        <div class="divide">/
                        </div>
                    </div>
                    <div class="box">7
                    </div>
                    <div class="box">8
                    </div>
                    <div class="box">9
                    </div>
                    <div class="box">
                        <div class="prod">*
                        </div>
                    </div>
                    <div class="box">4
                    </div>
                    <div class="box">5
                    </div>
                    <div class="box">6
                    </div>
                    <div class="box sub">-
                    </div>
                    <div class="box">1
                    </div>
                    <div class="box">2
                    </div>
                    <div class="box">3
                    </div>
                    <div class="box add">+
                    </div>
                    <div class="box">
                        <div>
                            <i class="fa-solid fa-plus-minus"></i>
                        </div>
                    </div>
                    <div class="box">0
                    </div>
                    <div class="box">
                        <div>.</div>
                    </div>
                    <div class="box equalBox">=
                    </div>
                </div>
            </div>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
